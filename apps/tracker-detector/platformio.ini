; Tracker detector - see README.md in this folder. Build: pio run (in this folder)

[env:m5stack-stamps3]
; same platform as the other apps (ESP-IDF 5.4.0)
platform = platformio/espressif32@6.10.0
board = m5stack-stamps3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_singleapp_large.csv
; build_version.py: writes src/firmware_version.h (git describe, shown in the help screen)
; merge_firmware.py: also writes factory.bin (bootloader + partitions + app, flash at 0x0)
extra_scripts =
    pre:../../scripts/build_version.py
    post:../../scripts/merge_firmware.py
lib_deps =
    ; shared Cardputer code: display, battery, keyboard
    symlink://../../lib/cardputer
