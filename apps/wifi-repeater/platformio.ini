; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamps3]
; 6.10.0 ships ESP-IDF 5.4.0, the version sdkconfig.m5stack-stamps3 was generated with
platform = platformio/espressif32@6.10.0
board = m5stack-stamps3
framework = espidf
monitor_speed = 115200
; 1500K app instead of 1M (NVS stays at 0x9000, app at 0x10000)
board_build.partitions = partitions_singleapp_large.csv
; build_version.py: writes src/firmware_version.h (git describe, shown in the web panel)
; merge_firmware.py: also writes factory.bin (bootloader + partitions + app, flash at 0x0)
extra_scripts =
    pre:../../scripts/build_version.py
    post:../../scripts/merge_firmware.py
lib_deps =
    ; shared Cardputer code: display, battery, keyboard, QR codes
    symlink://../../lib/cardputer
    esphome/wireguard@0.4.8
build_flags =
    ; allowed IPs: own tunnel address + 0.0.0.0/0 (full tunnel) or up to 8 split tunnel networks
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=10
    ; split tunnel: the listed networks are routed to the tunnel by a wrapper around
    ; ESP-IDF's routing hook (__wrap_ip4_route_src_hook in src/main.cpp)
    -Wl,--wrap=ip4_route_src_hook
