name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIO_ENV: m5stack-stamps3
  PLATFORMIO_VERSION: 6.1.19
  ESP_IDF_SIZE_VERSION: 2.3.2

jobs:
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hardware independent code of all apps (see test/host/Makefile) with
      # AddressSanitizer and UndefinedBehaviorSanitizer
      - name: Build and run
        run: make -C test/host

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One PlatformIO project per app in apps/
        app: [wifi-repeater, tracker-detector, room-scanner]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Toolchain, ESP-IDF and its Python environment (~1 GB) - keyed on the
      # exact Python version because the IDF virtualenv links to it
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('apps/*/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      # Own virtualenv so its dependencies cannot change PlatformIO's
      - name: Install esp-idf-size
        run: |
          python -m venv ~/esp-idf-size
          ~/esp-idf-size/bin/pip install "esp-idf-size==${ESP_IDF_SIZE_VERSION}"

      - name: Build
        run: pio run --environment "$PIO_ENV"

      # Flash layout, app partition, bootloader, PSRAM and free RAM - see scripts/check_fit.py
      - name: Check that the firmware fits the Cardputer
        run: ~/esp-idf-size/bin/python ../../scripts/check_fit.py ".pio/build/${PIO_ENV}" --sdkconfig "sdkconfig.${PIO_ENV}" --require-ram

      - name: Collect binaries
        id: collect
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP: ${{ matrix.app }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${SHA::7}"
          fi
          name="${APP}-${version}"
          build=".pio/build/${PIO_ENV}"

          dist="${GITHUB_WORKSPACE}/dist"
          mkdir -p "$dist"
          cp "${build}/factory.bin"    "${dist}/${name}-factory.bin"
          cp "${build}/firmware.bin"   "${dist}/${name}-app.bin"
          cp "${build}/bootloader.bin" "${dist}/${name}-bootloader.bin"
          cp "${build}/partitions.bin" "${dist}/${name}-partitions.bin"
          cp "${build}/firmware.elf"   "${dist}/${name}.elf"
          cp "${build}"/*.map          "${dist}/${name}.map"
          ls -l "$dist"

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The artifacts of all apps in one folder
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Only the two images people flash - bootloader, partition table, ELF and map
      # stay in the workflow artifact
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Goes above the generated list of changes
          NOTES: |
            ## Which app?

            | App | What it does |
            |---|---|
            | `wifi-repeater` | WiFi repeater / travel router with WireGuard VPN and captive portal support |
            | `tracker-detector` | Warns about Bluetooth trackers (AirTag, SmartTag, Tile, ...) that travel with you |
            | `room-scanner` | Checks a hotel room for hidden WiFi cameras |

            ## Which file?

            | File | How to flash it |
            |---|---|
            | `…-app.bin` | Cardputer with [Launcher](https://github.com/bmorcelli/Launcher): copy it to the SD card and install it from the `SD` menu, or upload it in Launcher's web interface (`WUI` → `OTA`) |
            | `…-factory.bin` | Over USB with the [ESP web flasher](https://espressif.github.io/esptool-js/) or esptool, at address `0x0`. This overwrites the whole flash, Launcher included |
        run: |
          files=(dist/*-app.bin dist/*-factory.bin)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release created on GitHub: attach the files and keep its notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "$NOTES" \
              --generate-notes \
              --verify-tag
          fi
